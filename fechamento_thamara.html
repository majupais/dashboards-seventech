<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fechamento — Thamara</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#0b0d13; --surface:#13161f; --surface-2:#181c27;
    --border:rgba(255,255,255,0.07);
    --text:#f0f0f0; --muted:rgba(255,255,255,0.45); --hint:rgba(255,255,255,0.25);
    --prata-color:#7ab8f5; --prata-bg:rgba(55,138,221,0.14); --prata-border:rgba(55,138,221,0.5);
    --bronze-color:#f5c842; --bronze-bg:rgba(220,160,20,0.14); --bronze-border:rgba(220,160,20,0.5);
    --fora-color:#f08080; --fora-bg:rgba(220,70,70,0.12); --fora-border:rgba(220,70,70,0.3);
    --prata-zone:rgba(55,138,221,0.45); --bronze-zone:rgba(220,160,20,0.38); --empty-zone:rgba(255,255,255,0.07);
  }
  html, body { background:#05060a; color:var(--text); font-family:'DM Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  body { padding:24px 16px 48px; }

  /* Barra de ações (não sai no PDF) */
  .toolbar { max-width:210mm; margin:0 auto 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  .toolbar label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .toolbar input { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-family:inherit; font-size:13px; color-scheme:dark; }
  .btn { background:#2f7fd4; color:#fff; border:0; border-radius:8px; padding:9px 16px; font-family:inherit; font-size:13px; font-weight:500; cursor:pointer; }
  .btn:hover { background:#3a8ce3; }
  .btn:disabled { opacity:.5; cursor:default; }

  /* Folha A4 */
  .page { width:210mm; min-height:297mm; margin:0 auto; background:var(--bg); padding:9mm 12mm 7mm; display:flex; flex-direction:column; gap:4mm; }
  #conteudo { display:flex; flex-direction:column; gap:4mm; flex:1; }

  .head { display:flex; align-items:center; gap:16px; padding-bottom:4mm; border-bottom:0.5px solid var(--border); }
  .avatar { width:54px; height:54px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,0.12); }
  .head-txt { flex:1; }
  .eyebrow { font-size:9px; letter-spacing:.14em; color:var(--hint); font-weight:500; }
  .title { font-size:24px; font-weight:500; letter-spacing:-0.02em; margin-top:3px; }
  .subtitle { font-size:12px; color:var(--muted); margin-top:2px; }
  .brand { text-align:right; font-size:10px; color:var(--hint); line-height:1.6; }
  .brand b { display:block; font-size:13px; color:var(--text); font-weight:600; letter-spacing:.02em; }

  .summary { display:flex; align-items:center; gap:14px; background:var(--surface); border:0.5px solid var(--border); border-radius:12px; padding:9px 16px; }
  .summary .big { font-family:'DM Mono',monospace; font-size:28px; font-weight:400; }
  .summary .txt { font-size:12px; color:var(--muted); line-height:1.5; }
  .summary .txt b { color:var(--text); font-weight:500; }

  .section-label { font-size:9px; font-weight:500; letter-spacing:.12em; color:var(--hint); margin-bottom:8px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:8px; }

  .mcard { background:var(--surface); border:0.5px solid var(--border); border-radius:11px; padding:10px 13px; display:flex; flex-direction:column; gap:5px; position:relative; overflow:hidden; }
  .mcard::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
  .mcard.prata  { background:rgba(55,138,221,0.08); border:1px solid var(--prata-border); }
  .mcard.prata::before  { background:linear-gradient(90deg,transparent,var(--prata-color),transparent); }
  .mcard.bronze { background:rgba(220,160,20,0.07); border:1px solid var(--bronze-border); }
  .mcard.bronze::before { background:linear-gradient(90deg,transparent,var(--bronze-color),transparent); }
  .mcard.fora   { border:1px solid var(--fora-border); }
  .mlabel { font-size:8.5px; font-weight:500; letter-spacing:.07em; color:var(--muted); }
  .mvalue { font-size:26px; font-weight:400; letter-spacing:-0.03em; line-height:1; font-family:'DM Mono',monospace; }
  .munit { font-size:13px; color:var(--muted); margin-left:2px; font-family:'DM Sans',sans-serif; }
  .mdetail { font-size:9.5px; color:var(--hint); }
  .badge { display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:500; padding:2px 9px; border-radius:20px; width:fit-content; border:0.5px solid var(--border); color:var(--muted); }
  .badge::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; }
  .prata-badge  { background:var(--prata-bg);  color:var(--prata-color);  border-color:var(--prata-border); }
  .bronze-badge { background:var(--bronze-bg); color:var(--bronze-color); border-color:var(--bronze-border); }
  .fora-badge   { background:var(--fora-bg);   color:var(--fora-color);   border-color:var(--fora-border); }
  .zbar { height:4px; position:relative; margin-top:6px; }
  .zbar-inner { display:flex; width:100%; height:4px; border-radius:3px; overflow:hidden; }
  .z-prata { background:var(--prata-zone); } .z-bronze { background:var(--bronze-zone); } .z-empty { background:var(--empty-zone); }
  .zmarker { position:absolute; top:-4px; width:2.5px; height:12px; background:#fff; border-radius:2px; transform:translateX(-50%); }
  .zticks { display:flex; justify-content:space-between; margin-top:4px; }
  .ztick { font-size:8px; color:var(--hint); }

  .chart-box { background:var(--surface); border:0.5px solid var(--border); border-radius:11px; padding:10px 14px 7px; }
  .chart-box svg { display:block; width:100%; height:auto; }
  .legend { display:flex; gap:14px; font-size:9px; color:var(--muted); margin-top:4px; }
  .legend i { display:inline-block; width:10px; height:2px; vertical-align:middle; margin-right:5px; }

  table { width:100%; border-collapse:collapse; font-size:9.5px; }
  thead th { text-align:right; font-weight:500; color:var(--hint); letter-spacing:.05em; font-size:8px; padding:4px 6px; border-bottom:0.5px solid var(--border); }
  thead th:first-child, tbody td:first-child, thead th:last-child, tbody td:last-child { text-align:left; }
  tbody td { text-align:right; padding:2.2px 6px; border-bottom:0.5px solid rgba(255,255,255,0.04); font-family:'DM Mono',monospace; font-size:9px; }
  tbody td:last-child { font-family:'DM Sans',sans-serif; color:var(--muted); }
  tbody tr.fora-meta td { color:var(--hint); }
  tbody tr.fora-meta td:last-child { font-style:italic; }
  .c-prata { color:var(--prata-color); } .c-bronze { color:var(--bronze-color); } .c-fora { color:var(--fora-color); }
  tfoot td { padding:7px 6px; font-weight:500; text-align:right; border-top:0.5px solid rgba(255,255,255,0.15); font-family:'DM Mono',monospace; font-size:9.5px; }
  tfoot td:first-child { text-align:left; font-family:'DM Sans',sans-serif; }

  .notes { font-size:8px; color:var(--hint); line-height:1.55; margin-top:auto; padding-top:3mm; border-top:0.5px solid var(--border); }
  .loading, .erro { text-align:center; color:var(--muted); padding:40px 0; font-size:13px; }
  .erro { color:var(--fora-color); }

  @page { size:A4 portrait; margin:0; }
  @media print {
    html, body { background:var(--bg); padding:0; }
    .toolbar { display:none; }
    .page { margin:0; width:210mm; min-height:297mm; zoom:var(--fit, 1); }
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    tr, .mcard, .chart-box { break-inside:avoid; }
  }
  @media screen and (max-width:820px) {
    .page { width:100%; min-height:auto; padding:20px 16px; }
    .grid { grid-template-columns:1fr; } .grid-2 { grid-template-columns:1fr; }
    .table-wrap { overflow-x:auto; }
  }
</style>
</head>

    csat: { bronze:4.0, prata:4.5, maior:true,  max:5   },
    aval: { bronze:50,  prata:65,  maior:true,  max:100 },
    mon:  { bronze:4.0, prata:4.5, maior:true,  max:5   },
    frt:  { bronze:5,   prata:3,   maior:false, max:8   },
    art:  { bronze:10,  prata:7,   maior:false, max:13  },
  };

  function nivel(k, v) {
    if (v == null) return null;
    const m = METAS[k];
    if (m.maior) return v >= m.prata ? 'prata' : v >= m.bronze ? 'bronze' : 'fora';
    return v <= m.prata ? 'prata' : v <= m.bronze ? 'bronze' : 'fora';
  }
  const labelNivel = n => n==='prata' ? 'Prata' : n==='bronze' ? 'Bronze' : n==='fora' ? 'Fora da meta' : 'Sem dados';
  const fmt = (v, c) => Number(v).toFixed(c).replace('.', ',');
  function toMinSec(v) {
    let mins = Math.floor(v), secs = Math.round((v - mins) * 60);
    if (secs === 60) { mins++; secs = 0; }
    return `${mins}:${String(secs).padStart(2,'0')}`;
  }
  const pos = (v, max) => Math.min(Math.max(v / max * 100, 0.5), 99).toFixed(1) + '%';
  const toNum = v => { if (v == null || v === '') return null; if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };

  function hojeBRT() {
    const p = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit' })
      .formatToParts(new Date()).reduce((o, x) => (o[x.type] = x.value, o), {});
    return { y:+p.year, m:+p.month, d:+p.day };
  }

  // Mês padrão = mês anterior (ou ?mes=AAAA-MM na URL)
  function mesInicial() {
    const q = new URLSearchParams(location.search).get('mes');
    if (q && /^\d{4}-\d{2}$/.test(q)) return q;
    const h = hojeBRT();
    const y = h.m === 1 ? h.y - 1 : h.y, m = h.m === 1 ? 12 : h.m - 1;
    return `${y}-${String(m).padStart(2,'0')}`;
  }

  async function fetchRaioX(inicio, fim) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/fn_metas_atendente`, {
      method:'POST',
      headers:{ 'apikey':SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_agent:AGENTE, p_inicio:inicio, p_fim:fim })
    });
    if (!res.ok) throw new Error('Raio-X ' + res.status + ': ' + await res.text());
    return res.json();
  }

  async function fetchMonitoria() {
    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}&range=A2:C6&headers=0`;
      const text = await (await fetch(url)).text();
      const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
      return toNum(json.table.rows[2]?.c[0]?.v);
    } catch (e) { console.error(e); return null; }
  }

  function card(k, label, valor, html, detalhe, ticks, zonas) {
    const n = nivel(k, valor);
    const cor = n ? `var(--${n}-color)` : 'var(--muted)';
    const marker = valor == null ? '' : `<div class="zmarker" style="left:${pos(valor, METAS[k].max)}"></div>`;
    return `
      <div class="mcard ${n || ''}">
        <div class="mlabel">${label}</div>
        <div class="mvalue" style="color:${cor}">${valor == null ? '—' : html}</div>
        <div class="badge ${n ? n + '-badge' : ''}">${labelNivel(n)}</div>
        <div class="mdetail">${detalhe}</div>
        <div class="zbar"><div class="zbar-inner">${zonas}</div>${marker}</div>
        <div class="zticks">${ticks.map(t => `<span class="ztick">${t}</span>`).join('')}</div>
      </div>`;
  }

  function grafico(dias) {
    const d = dias.filter(x => x.conta_csat);
    if (!d.length) return '';
    const W = 640, H = 88, PL = 28, PR = 6, PT = 8, PB = 22;
    const iw = W - PL - PR, ih = H - PT - PB;
    const bw = iw / d.length;
    const y = v => PT + ih - (v / 100) * ih;
    let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, sans-serif">`;
    [0, 25, 50, 75, 100].forEach(v => {
      s += `<line x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,0.05)"/>`;
      s += `<text x="${PL - 5}" y="${y(v) + 3}" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="end">${v}%</text>`;
    });
    d.forEach((x, i) => {
      const v = Number(x.pct_resposta || 0);
      const n = nivel('aval', v);
      const cor = n === 'prata' ? '#7ab8f5' : n === 'bronze' ? '#f5c842' : '#f08080';
      const bx = PL + i * bw + bw * 0.18, w = bw * 0.64;
      s += `<rect x="${bx}" y="${y(v)}" width="${w}" height="${Math.max(y(0) - y(v), 0)}" rx="2" fill="${cor}" fill-opacity="0.75"/>`;
      s += `<text x="${bx + w / 2}" y="${H - 8}" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">${x.dia.slice(8, 10)}</text>`;
    });
    s += `<line x1="${PL}" x2="${W - PR}" y1="${y(50)}" y2="${y(50)}" stroke="#f5c842" stroke-dasharray="4 3" stroke-width="1"/>`;
    s += `<line x1="${PL}" x2="${W - PR}" y1="${y(65)}" y2="${y(65)}" stroke="#7ab8f5" stroke-dasharray="4 3" stroke-width="1"/>`;
    return s + '</svg>';
  }

  function celula(k, v, txt) {
    if (v == null) return '<td>—</td>';
    const n = nivel(k, Number(v));
    return `<td class="c-${n}">${txt}</td>`;
  }

  async function render() {
    const mes = document.getElementById('mes').value;
    const [y, m] = mes.split('-').map(Number);
    const ultimo = new Date(y, m, 0).getDate();
    const inicio = `${mes}-01`, fim = `${mes}-${String(ultimo).padStart(2,'0')}`;
    const nomeMes = `${MESES[m - 1]} ${y}`;
    const box = document.getElementById('conteudo');
    const btn = document.getElementById('btn-pdf');
    btn.disabled = true;
    box.innerHTML = '<div class="loading">Carregando dados do Raio-X…</div>';
    document.getElementById('titulo').textContent = `Thamara · ${nomeMes}`;
    document.title = `Fechamento_Thamara_${MESES[m - 1]}_${y}`;
    document.getElementById('gerado').textContent = 'gerado em ' + new Date().toLocaleDateString('pt-BR', { timeZone:'America/Sao_Paulo' });

    let r;
    try { r = await fetchRaioX(inicio, fim); }
    catch (e) { console.error(e); box.innerHTML = `<div class="erro">Não foi possível carregar os dados do Raio-X.<br><small>${e.message}</small></div>`; return; }

    const monInput = document.getElementById('mon-input');
    let mon = toNum(monInput.value);
    if (mon == null) { mon = await fetchMonitoria(); if (mon != null) monInput.value = fmt(mon, 2); }

    const metricas = [
      ['csat', r.nota_media], ['aval', r.pct_resposta], ['mon', mon], ['frt', r.frt_min], ['art', r.art_min]
    ].map(([k, v]) => nivel(k, v == null ? null : Number(v)));
    const prata  = metricas.filter(n => n === 'prata').length;
    const bronze = metricas.filter(n => n === 'bronze').length;
    const fora   = metricas.filter(n => n === 'fora').length;
    const atingidas = prata + bronze;

    const z = (a, b, c) => `<div class="${a[0]}" style="width:${a[1]}"></div><div class="${b[0]}" style="width:${b[1]}"></div><div class="${c}" style="flex:1"></div>`;

    const linhas = r.dias.filter(d => d.atendimentos || d.frt_min != null || (d.motivo_fora && d.motivo_fora !== 'Fim de semana'));
    const corpo = linhas.map(d => {
      const dt = new Date(d.dia + 'T12:00:00');
      const fora = !d.conta_csat;
      const obs = d.motivo_fora ? `Fora da meta: ${d.motivo_fora}` : (fora ? 'Sem atendimentos' : '');
      return `<tr class="${fora ? 'fora-meta' : ''}">
        <td>${d.dia.slice(8,10)}/${d.dia.slice(5,7)} ${SEMANA[dt.getDay()]}</td>
        <td>${d.atendimentos ?? '—'}</td>
        <td>${d.respondidos ?? '—'}</td>
        ${fora ? `<td>${d.pct_resposta != null ? fmt(d.pct_resposta, 2) + '%' : '—'}</td>` : celula('aval', d.pct_resposta, fmt(d.pct_resposta, 2) + '%')}
        ${fora ? `<td>${d.nota_media != null ? fmt(d.nota_media, 2) : '—'}</td>` : celula('csat', d.nota_media, d.nota_media != null ? fmt(d.nota_media, 2) : '')}
        ${celula('frt', d.frt_min, d.frt_min != null ? toMinSec(d.frt_min) : '')}
        ${celula('art', d.art_min, d.art_min != null ? toMinSec(d.art_min) : '')}
        <td>${obs}</td>
      </tr>`;
    }).join('');

    box.innerHTML = `
      <div class="summary">
        <div class="big" style="color:${fora === 0 ? 'var(--prata-color)' : atingidas >= 3 ? 'var(--bronze-color)' : 'var(--fora-color)'}">${atingidas}/5</div>
        <div class="txt"><b>${atingidas} de 5 metas atingidas em ${nomeMes}</b><br>
          ${prata} no nível prata · ${bronze} no bronze · ${fora} fora da meta${metricas.includes(null) ? ' · ' + metricas.filter(n => n === null).length + ' sem dados' : ''}
        </div>
      </div>

      <div>
        <div class="section-label">QUALIDADE E SATISFAÇÃO</div>
        <div class="grid">
          ${card('csat', 'CSAT — SATISFAÇÃO NO SUPORTE', r.nota_media == null ? null : Number(r.nota_media),
                 r.nota_media == null ? '' : fmt(r.nota_media, 2),
                 `média de ${r.dias_csat} dias úteis · ${r.respondidos} avaliações`,
                 ['0', 'bronze 4,0', 'prata 4,5', '5'], z(['z-empty','80%'], ['z-bronze','10%'], 'z-prata'))}
          ${card('aval', '% AVALIAÇÕES RECEBIDAS', r.pct_resposta == null ? null : Number(r.pct_resposta),
                 r.pct_resposta == null ? '' : fmt(r.pct_resposta, 2) + '<span class="munit">%</span>',
                 `${r.respondidos} de ${r.atendimentos} atendimentos${r.notas_manuais ? ' · ' + r.notas_manuais + ' manuais' : ''}`,
                 ['0%', 'bronze 50%', 'prata 65%', '100%'], z(['z-empty','50%'], ['z-bronze','15%'], 'z-prata'))}
          ${card('mon', 'MONITORIA DE QUALIDADE', mon,
                 mon == null ? '' : fmt(mon, 2), 'informada na planilha de metas',
                 ['0', 'bronze 4,0', 'prata 4,5', '5'], z(['z-empty','80%'], ['z-bronze','10%'], 'z-prata'))}
        </div>
        <div class="grid-2">
          ${card('frt', 'FRT — PRIMEIRA RESPOSTA', r.frt_min == null ? null : Number(r.frt_min),
                 r.frt_min == null ? '' : toMinSec(r.frt_min) + '<span class="munit">min</span>',
                 `média de ${r.tickets_frt} atendimentos`,
                 ['0', 'prata 3min', 'bronze 5min', '8min'], z(['z-prata','37.5%'], ['z-bronze','25%'], 'z-empty'))}
          ${card('art', 'ART — TEMPO ENTRE MENSAGENS', r.art_min == null ? null : Number(r.art_min),
                 r.art_min == null ? '' : toMinSec(r.art_min) + '<span class="munit">min</span>',
                 `média de ${r.tickets_art} atendimentos`,
                 ['0', 'prata 7min', 'bronze 10min', '13min'], z(['z-prata','53.8%'], ['z-bronze','23.1%'], 'z-empty'))}
        </div>
      </div>

      <div>
        <div class="section-label">% DE AVALIAÇÕES POR DIA ÚTIL</div>
        <div class="chart-box">
          ${grafico(r.dias)}
          <div class="legend"><span><i style="background:#f5c842"></i>bronze 50%</span><span><i style="background:#7ab8f5"></i>prata 65%</span></div>
        </div>
      </div>

      <div>
        <div class="section-label">DIA A DIA</div>
        <div class="table-wrap">
        <table>
          <thead><tr><th>DIA</th><th>ATEND.</th><th>AVALIADOS</th><th>% AVAL.</th><th>NOTA</th><th>FRT</th><th>ART</th><th>OBSERVAÇÃO</th></tr></thead>
          <tbody>${corpo || '<tr><td colspan="8">Sem atendimentos no mês.</td></tr>'}</tbody>
          <tfoot><tr>
            <td>Resultado do mês</td>
            <td>${r.atendimentos}</td><td>${r.respondidos}</td>
            <td>${r.pct_resposta != null ? fmt(r.pct_resposta, 2) + '%' : '—'}</td>
            <td>${r.nota_media != null ? fmt(r.nota_media, 2) : '—'}</td>
            <td>${r.frt_min != null ? toMinSec(r.frt_min) : '—'}</td>
            <td>${r.art_min != null ? toMinSec(r.art_min) : '—'}</td>
            <td></td>
          </tr></tfoot>
        </table>
        </div>
      </div>

      <div class="notes">
        CSAT e % de avaliações: média das médias diárias dos dias úteis, pela data de encerramento (sem fins de semana, feriados e dias fora da meta). FRT e ART: média por atendimento, pela data de início, com as correções aprovadas. Fonte: Raio-X · Monitoria: planilha de metas.
      </div>`;
    btn.disabled = false;
    ajustarFolha();
  }

  // Garante que o PDF caiba em 1 página A4 (reduz um pouco a escala se precisar)
  function ajustarFolha() {
    const page = document.getElementById('page');
    page.style.removeProperty('--fit');
    if (window.matchMedia('(max-width:820px)').matches) return;
    const a4 = 297 * 96 / 25.4;
    const h = page.scrollHeight;
    if (h > a4) page.style.setProperty('--fit', (Math.floor(a4 / h * 1000) / 1000 - 0.005).toString());
  }

  document.getElementById('mes').value = mesInicial();
  document.getElementById('mes').addEventListener('change', () => {
    document.getElementById('mon-input').value = '';
    history.replaceState(null, '', '?mes=' + document.getElementById('mes').value);
    render();
  });
  document.getElementById('mon-input').addEventListener('change', render);
  render();
</script>
</body>
</html>
